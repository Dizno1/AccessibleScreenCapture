[package]
name = "accessible-screen-capture"
version = "3.0.0-12"
description = "Professional screen capture designed from the ground up for keyboard and screen reader users."
authors = ["Open Door Design"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tokio = { version = "1", features = ["time", "fs", "io-util"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
# For the ffmpeg sidecar used to mux native video + WASAPI audio
# (src-tauri/src/native_mux.rs) - see that module's own comment for
# why a sidecar rather than raw Media Foundation or a Rust muxing
# crate. The Windows GitHub Actions workflow
# (.github/workflows/build-windows.yml) automatically downloads,
# checksum-verifies, target-triple-renames, and supplies the real
# ffmpeg.exe sidecar binary before Tauri packaging - no manual step
# is required for builds that go through that workflow.
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
xcap = "0.0.13"
# Pin the JPEG decoder below 0.5.15 because 0.5.15 currently fails
# to compile in the Windows GitHub Actions build. image 0.25.x accepts
# the 0.5.x decoder line, so this constrains the transitive resolution
# without upgrading xcap, image, Tauri, or unrelated dependencies.
zune-jpeg = "=0.5.14"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_Media_Speech",
  "Win32_System_Com",
] }
# Native Windows Graphics Capture proof (src-tauri/src/native_capture.rs)
# only - not wired into the working recorder. This crate depends on
# its own internal version of `windows`, resolved by Cargo as a
# separate compiled dependency from our own pinned `windows = "0.58"`
# above (Cargo supports multiple incompatible versions of the same
# crate name coexisting in one graph) - so this does not force
# upgrading the windows dependency the rest of this project already
# uses. That only holds as long as native_capture.rs never passes a
# type from one version's API surface into the other, which it
# deliberately does not.
windows-capture = "2"
# WASAPI loopback for native system audio (src-tauri/src/native_audio.rs).
# Like windows-capture above, this carries its own internal windows-rs
# dependency, resolved by Cargo as a separate compiled crate from our
# own pinned windows = "0.58" - native_audio.rs never passes a type
# between the two, so there's no version boundary to conflict.
# 0.23.0 is the real current version (confirmed by resolving the
# previous >=0.4,<1.0 range) - pinned exactly rather than left open.
# native_audio.rs's API calls were corrected to match 0.23.0's actual
# API this round (DeviceEnumerator-based device discovery,
# get_next_packet_size/read_from_device for buffer reads) rather than
# the reconstructed older-era shapes used before.
wasapi = "=0.23.0"

