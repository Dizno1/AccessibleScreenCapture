[package]
name = "accessible-screen-capture"
version = "1.0.6"
description = "Professional screen capture designed from the ground up for keyboard and screen reader users."
authors = ["Open Door Design"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
xcap = "0.0.13"
# Pin the JPEG decoder below 0.5.15 because 0.5.15 currently fails
# to compile in the Windows GitHub Actions build. image 0.25.x accepts
# the 0.5.x decoder line, so this constrains the transitive resolution
# without upgrading xcap, image, Tauri, or unrelated dependencies.
zune-jpeg = "=0.5.14"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_Media_Speech",
  "Win32_System_Com",
] }
# Native Windows Graphics Capture proof (src-tauri/src/native_capture.rs)
# only - not wired into the working recorder. This crate depends on
# its own internal version of `windows`, resolved by Cargo as a
# separate compiled dependency from our own pinned `windows = "0.58"`
# above (Cargo supports multiple incompatible versions of the same
# crate name coexisting in one graph) - so this does not force
# upgrading the windows dependency the rest of this project already
# uses. That only holds as long as native_capture.rs never passes a
# type from one version's API surface into the other, which it
# deliberately does not.
windows-capture = "2"

