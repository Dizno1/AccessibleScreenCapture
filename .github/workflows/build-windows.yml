name: build-windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Prepare frontend distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/prepare-dist.js
          if (-not (Test-Path "dist/index.html")) {
            throw "Frontend preparation failed: dist/index.html was not created."
          }
          Write-Host "Frontend distribution prepared successfully."

      - name: Prepare ffmpeg sidecar for Tauri
        # Native A/V muxing needs a real static LGPL ffmpeg.exe at the
        # exact Tauri sidecar path before either Windows build path runs.
        #
        # Do NOT hard-code BtbN's generated master-build filename. Real
        # testing on 2026-08-10 proved that the filename contains the
        # current FFmpeg N-build/commit identifier (for example,
        # ffmpeg-N-...-win64-lgpl.zip), so the old assumed
        # ffmpeg-master-latest-win64-lgpl.zip URL returned HTTP 404.
        #
        # Instead, query GitHub's Releases API for BtbN's actual latest
        # release, select the one static master win64 LGPL asset published
        # in that release, and download checksums.sha256 from that SAME
        # release. The exact selected tag, filename, URLs, and SHA-256 are
        # written to the build log. The checksum must match before the
        # archive is extracted or bundled.
        #
        # The lgpl-shared build is intentionally excluded because it needs
        # companion libav* DLLs. The static lgpl build is self-contained.
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $hostTuple = $null
          try {
            $hostTuple = (rustc --print host-tuple).Trim()
          } catch {
            Write-Host "rustc --print host-tuple unavailable, falling back to rustc -Vv"
          }
          if (-not $hostTuple) {
            $verboseInfo = rustc -Vv
            $hostLine = $verboseInfo | Select-String "^host:"
            if (-not $hostLine) {
              throw "Could not determine the Rust target triple from either 'rustc --print host-tuple' or 'rustc -Vv'."
            }
            $hostTuple = ($hostLine.Line -split ":\s*")[1].Trim()
          }
          Write-Host "Determined target triple: $hostTuple"

          $apiUrl = "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest"
          $headers = @{
            "Accept" = "application/vnd.github+json"
            "Authorization" = "Bearer $env:GH_TOKEN"
            "User-Agent" = "AccessibleScreenCapture-GitHub-Actions"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          Write-Host "Resolving the current BtbN release and its real asset filenames via GitHub API: $apiUrl"
          $release = Invoke-RestMethod -Uri $apiUrl -Headers $headers -Method Get
          if (-not $release.tag_name) {
            throw "GitHub's releases/latest API returned no BtbN release tag."
          }
          Write-Host "Resolved BtbN release tag: $($release.tag_name)"

          # BtbN's master autobuild currently uses a generated N-build name.
          # Retain support for the older master-latest alias if upstream ever
          # restores it, but require exactly one static win64 LGPL master asset.
          $ffmpegAssets = @($release.assets | Where-Object {
            $_.name -eq "ffmpeg-master-latest-win64-lgpl.zip" -or
            $_.name -cmatch '^ffmpeg-N-.*-win64-lgpl\.zip$'
          })
          if ($ffmpegAssets.Count -ne 1) {
            $available = ($release.assets | ForEach-Object { $_.name }) -join ", "
            throw "Expected exactly one static master win64 LGPL FFmpeg zip in release $($release.tag_name), found $($ffmpegAssets.Count). Published assets: $available"
          }
          $ffmpegAsset = $ffmpegAssets[0]

          $checksumAssets = @($release.assets | Where-Object { $_.name -eq "checksums.sha256" })
          if ($checksumAssets.Count -ne 1) {
            throw "Expected exactly one checksums.sha256 asset in release $($release.tag_name), found $($checksumAssets.Count)."
          }
          $checksumAsset = $checksumAssets[0]

          $artifactName = $ffmpegAsset.name
          $ffmpegUrl = $ffmpegAsset.browser_download_url
          $checksumUrl = $checksumAsset.browser_download_url
          $downloadPath = "ffmpeg-download.zip"
          $checksumPath = "checksums.sha256"

          Write-Host "Selected FFmpeg asset: $artifactName"
          Write-Host "Downloading FFmpeg from $ffmpegUrl"
          Invoke-WebRequest -Uri $ffmpegUrl -Headers $headers -OutFile $downloadPath

          Write-Host "Downloading checksum manifest from $checksumUrl"
          Invoke-WebRequest -Uri $checksumUrl -Headers $headers -OutFile $checksumPath

          $checksumLine = Get-Content $checksumPath | Where-Object { $_ -match [regex]::Escape($artifactName) }
          if (-not $checksumLine) {
            throw "No checksum entry for $artifactName was found in the checksums.sha256 manifest from release $($release.tag_name)."
          }
          if (@($checksumLine).Count -ne 1) {
            throw "Expected one checksum entry for $artifactName, found $(@($checksumLine).Count)."
          }
          $expectedHash = ($checksumLine -split "\s+")[0].Trim().ToLower()
          $actualHash = (Get-FileHash -Path $downloadPath -Algorithm SHA256).Hash.ToLower()

          Write-Host "Expected SHA-256: $expectedHash"
          Write-Host "Actual SHA-256:   $actualHash"
          if ($expectedHash -ne $actualHash) {
            throw "Checksum verification FAILED for $artifactName. Refusing to extract or bundle it."
          }
          Write-Host "Checksum verified successfully."

          $extractDir = "ffmpeg-extracted"
          Expand-Archive -Path $downloadPath -DestinationPath $extractDir -Force

          $ffmpegExe = Get-ChildItem -Path $extractDir -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          if (-not $ffmpegExe) {
            throw "ffmpeg.exe was not found anywhere inside $artifactName; upstream archive layout may have changed."
          }
          Write-Host "Found ffmpeg.exe at $($ffmpegExe.FullName)"

          $binariesDir = "src-tauri/binaries"
          New-Item -ItemType Directory -Force -Path $binariesDir | Out-Null
          $sidecarPath = Join-Path $binariesDir "ffmpeg-$hostTuple.exe"
          Copy-Item -Path $ffmpegExe.FullName -Destination $sidecarPath -Force

          if (-not (Test-Path $sidecarPath)) {
            throw "Expected sidecar binary was not created at $sidecarPath."
          }
          Write-Host "ffmpeg sidecar prepared at $sidecarPath"

          & $sidecarPath -version

      - name: Generate Cargo lockfile and dependency diagnostics
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

          "Resolved dependency tree for zune-jpeg:" | Out-File -FilePath dependency-resolution.txt -Encoding utf8
          cargo tree --manifest-path src-tauri/Cargo.toml -i zune-jpeg 2>&1 | Tee-Object -FilePath dependency-resolution.txt -Append

          "" | Out-File -FilePath dependency-resolution.txt -Append -Encoding utf8
          "Resolved dependency tree for image:" | Out-File -FilePath dependency-resolution.txt -Append -Encoding utf8
          cargo tree --manifest-path src-tauri/Cargo.toml -i image 2>&1 | Tee-Object -FilePath dependency-resolution.txt -Append

      - name: Stage llama-server sidecar for Tauri
        # Screenshot Confirmation's local vision model runs through a
        # bundled llama.cpp llama-server sidecar (see
        # screenshot_confirmation.rs for the full architecture
        # reasoning - Foundry Local's Qwen3-VL support was replaced
        # this round after confirming its config parser has a
        # real, upstream-acknowledged, "not planned" bug for this
        # exact model family). This step follows the exact same
        # pattern already proven for the FFmpeg sidecar: determine
        # the real target triple, download a real release asset,
        # verify it was extracted correctly, and place it at the
        # exact Tauri sidecar path - not a new, unproven packaging
        # mechanism.
        #
        # SOURCE: ggml-org/llama.cpp's own GitHub releases (the
        # upstream project itself, not a third-party rebuild) - the
        # Windows CPU-only build, since this feature has no
        # GPU-specific requirement and a CPU build keeps the
        # dependency surface (and download size) smaller. Pinned to
        # the latest published release via the GitHub API, resolved
        # at build time rather than a hardcoded version string that
        # would immediately go stale - reproducibility here is
        # secondary to the sidecar simply continuing to exist and
        # work, the same tradeoff already made and documented for the
        # FFmpeg sidecar's own "latest"-style acquisition.
        #
        # LICENSE: llama.cpp is MIT licensed. The model it loads
        # (Gemma 3 4B Instruct, downloaded separately by llama-server
        # itself on first use - not bundled in this repository or in
        # the installer) is Apache 2.0 licensed and explicitly
        # redistributable.
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $hostTuple = $null
          try {
            $hostTuple = (rustc --print host-tuple).Trim()
          } catch {
            Write-Host "rustc --print host-tuple unavailable, falling back to rustc -Vv"
          }
          if (-not $hostTuple) {
            $verboseInfo = rustc -Vv
            $hostLine = $verboseInfo | Select-String "^host:"
            if (-not $hostLine) {
              throw "Could not determine the Rust target triple from either 'rustc --print host-tuple' or 'rustc -Vv'."
            }
            $hostTuple = ($hostLine.Line -split ":\s*")[1].Trim()
          }
          Write-Host "Determined target triple: $hostTuple"

          $llamaHeaders = @{
            "Accept" = "application/vnd.github+json"
            "Authorization" = "Bearer $env:GH_TOKEN"
            "User-Agent" = "AccessibleScreenCapture-GitHub-Actions"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $releaseInfo = Invoke-RestMethod -Uri "https://api.github.com/repos/ggml-org/llama.cpp/releases/latest" -Headers $llamaHeaders -Method Get
          $asset = $releaseInfo.assets | Where-Object { $_.name -match "^llama-.*-bin-win-cpu-x64\.zip$" } | Select-Object -First 1
          if (-not $asset) {
            throw "Could not find a win-cpu-x64 asset in the latest ggml-org/llama.cpp release ($($releaseInfo.tag_name)). Available assets: $($releaseInfo.assets.name -join ', ')"
          }
          Write-Host "Using llama.cpp release $($releaseInfo.tag_name), asset $($asset.name)"

          $downloadPath = "llama-server-download.zip"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $downloadPath

          $extractDir = "llama-server-extracted"
          Expand-Archive -Path $downloadPath -DestinationPath $extractDir -Force

          $serverExe = Get-ChildItem -Path $extractDir -Filter "llama-server.exe" -Recurse | Select-Object -First 1
          if (-not $serverExe) {
            throw "llama-server.exe was not found anywhere inside the downloaded archive - the archive layout may have changed upstream."
          }
          Write-Host "Found llama-server.exe at $($serverExe.FullName)"

          # llama-server.exe depends on the other DLLs/backends shipped
          # alongside it in the same release archive (ggml-cpu variant
          # DLLs, etc.) - the whole extracted bin directory is copied,
          # not just the one executable, so those dependencies are
          # actually present at runtime. Only the target-triple-named
          # entry point is what Tauri's externalBin mechanism looks
          # for; the rest travel alongside it under their own names.
          $binariesDir = "src-tauri/binaries"
          New-Item -ItemType Directory -Force -Path $binariesDir | Out-Null
          Copy-Item -Path (Join-Path $serverExe.DirectoryName "*") -Destination $binariesDir -Recurse -Force

          # Tauri externalBin only guarantees packaging of the target-triple
          # executable. The DLLs copied above are separately declared as bundle
          # resources in tauri.conf.json and installed into the resource root
          # beside the sidecar. screenshot_confirmation.rs also puts that same
          # directory on PATH for normal Windows DLL dependency resolution.
          $runtimeDlls = Get-ChildItem -Path $binariesDir -Filter "*.dll" -File
          if (-not $runtimeDlls -or $runtimeDlls.Count -eq 0) {
            throw "The llama.cpp Windows CPU archive contained no companion DLLs. Refusing to build a sidecar that would fail with STATUS_DLL_NOT_FOUND."
          }

          # Modern llama.cpp CPU releases use dynamically loaded GGML backends.
          # A server can start successfully yet fail every model with
          # "no backends are loaded" if the CPU backend DLLs are not installed
          # beside llama-server.exe. Require both the core runtime and at least
          # one CPU backend before allowing an installer to be produced.
          $cpuBackendDlls = @($runtimeDlls | Where-Object { $_.Name -match '^ggml-cpu.*\.dll$' })
          if ($cpuBackendDlls.Count -eq 0) {
            throw "The selected llama.cpp archive contains no ggml-cpu*.dll backend. Refusing to build Screenshot Confirmation without a CPU inference backend."
          }
          $llamaDll = @($runtimeDlls | Where-Object { $_.Name -eq 'llama.dll' })
          if ($llamaDll.Count -eq 0) {
            throw "The selected llama.cpp archive contains no llama.dll. Refusing to build an incomplete runtime."
          }

          Write-Host "Staged $($runtimeDlls.Count) llama.cpp runtime DLL(s), including $($cpuBackendDlls.Count) CPU backend DLL(s):"
          $runtimeDlls | ForEach-Object { Write-Host "  $($_.Name)" }

          $sidecarPath = Join-Path $binariesDir "llama-server-$hostTuple.exe"
          Copy-Item -Path $serverExe.FullName -Destination $sidecarPath -Force

          if (-not (Test-Path $sidecarPath)) {
            throw "Expected llama-server sidecar binary was not created at $sidecarPath."
          }
          Write-Host "llama-server sidecar prepared at $sidecarPath"

          & $sidecarPath --version

      - name: Build Windows application for manual run
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0

      - name: Upload Cargo lockfile diagnostics
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: AccessibleScreenCapture-Cargo-Lock-Diagnostics
          path: |
            src-tauri/Cargo.lock
            dependency-resolution.txt
          if-no-files-found: warn

      - name: Commit Cargo.lock now that this resolution built successfully
        # Runs only after the build step above succeeds - a step is
        # skipped by default if an earlier step in the job failed, so
        # a dependency resolution that didn't actually build is never
        # the one that gets locked in for future runs. src-tauri/Cargo.lock
        # exists on disk at this point regardless (cargo/tauri-action
        # generate it as a normal side effect of building) - this step
        # only adds committing it back to the repository, so the next
        # run reuses these exact versions instead of resolving fresh.
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [ -n "$(git status --porcelain src-tauri/Cargo.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src-tauri/Cargo.lock
            git commit -m "Add/update Cargo.lock for reproducible builds [skip ci]"
            git push
          fi

      - name: Upload Windows installers
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: AccessibleScreenCapture-Windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Build and create draft release for version tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AccessibleScreenCapture ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
